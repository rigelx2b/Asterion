[package]
name = "asterion-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "asterion"
path = "src/main.rs"

[dependencies]
asterion-core = { version = "0.1.0", path = "../asterion-core" }
asterion-data = { version = "0.1.0", path = "../asterion-data" }
asterion-model = { version = "0.1.0", path = "../asterion-model" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
