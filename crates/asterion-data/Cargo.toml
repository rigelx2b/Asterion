[package]
name = "asterion-data"
version.workspace = true
edition.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
asterion-core = { version = "0.1.0", path = "../asterion-core" }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std", "clock"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["query", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
wiremock = "0.6"

[lints]
workspace = true
